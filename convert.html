<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تبدیل دما</title>
    
  </head>
  <body
    class="flex justify-center items-center h-screen bg-gray-300 font-estedad"
  >
    <div class="flex flex-col items-center bg-white rounded-2xl p-4">
      <h1 class="text-2xl mb-5">تبدیل سلسیوس به فارنهایت</h1>
      <div class="flex flex-col w-full items-start">
        <label for="Celsius">از سلسیوس به فارنهایت</label>
        <input
          class="outline-0 bg-blue-200 w-full rounded-2xl py-2 my-2 text-center Celsius"
          id="Celsius"
          type="text"
          value=""
          autofocus
        />
        <label for="Fahrenheit">نتیجه :</label>
        <input
          class="outline-0 bg-blue-200 w-full rounded-2xl py-2 my-2 text-center"
          id="Fahrenheit"
          type="text"
          readonly
        />
      </div>
      <button
      id="delete-btn"
        class="px-4 py-3 bg-blue-400 shadow-2xl cursor-pointer rounded-2xl text-white hover:bg-blue-300 mt-2"
        type="button"
      >
        پاک کردن
      </button>
    </div>
   
    <script src="./src/js/convert.js"></script>
  </body>
</html>
