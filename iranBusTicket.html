<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusYar</title>
   
  </head>
  <body class="font-estedad">
    <!-- header -->
    <header
      class="relative w-full h-screen bg-[url('/images/foroshBlit/busHeroo.webp')] bg-no-repeat bg-cover bg-bottom-right"
    >
      <!-- navigation bar  -->
      <nav
        class="flex justify-between items-center w-full fixed top-0 px-40 py-7 text-2xl text-orange-600"
      >
        <a class="rounded-2xl overflow-hidden" href="#"
          ><img
            class="w-20"
            src="/public/images/foroshBlit/buslogo.png"
            alt="bus logo"
        /></a>

        <ul class="flex items-center gap-x-12">
          <li><a href="#">بلیط اتوبوس</a></li>
          <li><a href="#">استعلام بلیط</a></li>
          <li><a href="#">کنسلی بلیط</a></li>
          <li><a href="#">راهنما</a></li>
        </ul>

        <a class="" href="#">ورود و ثبت نام</a>
      </nav>

      <form
        class="absolute flex flex-col items-center text-2xl gap-3 top-2/5 left-40 bg-white rounded-2xl px-4 py-4"
        action="#"
        method="get"
      >
        <h1 class="text-center">بلیط اتوبوس</h1>
        <p class="text-center">
          خرید از ترمینال ها و شرکت‌های مسافربری معتبر کشور
        </p>
        <div class="flex flex-col w-full items-start">
          <!-- <input type="search" placeholder="مبدا" />
          <input type="text" placeholder="مقصد" /> -->
          <select name="ostan" id="ostan">
            <option value="تهران">تهران</option>
            <option value="مازندران">مازندران</option>
            <option value="اصفهان">اصفهان</option>
            <option value="خوزستان">خوزستان</option>
          </select>
          <select name="city" id="city">
            <option value="">شهر را انتخاب کنید</option>
          </select>
        </div>
        <button
          type="submit"
          class="text-white w-2xs bg-amber-600 py-3 rounded-2xl cursor-pointer"
          href="#"
        >
          جست و جو
        </button>
      </form>
    </header>

    <script src="./src/js/form.js"></script>
  </body>
</html>
